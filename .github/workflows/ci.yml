name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware lint rules need generated content collections to resolve
      # imports. Docs also needs sync so `.implement/tsconfig.json` exists for
      # oxlint's type-aware project.
      - run: pnpm generate
      - run: pnpm --filter @apps/docs sync
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The extension's analyzer tests resolve the docs app's `@/*` alias, which
      # lives in a generated tsconfig that is not committed. Typecheck already
      # gets this because `docs check` syncs first; `docs test` does not.
      - run: pnpm --filter docs sync
      - run: pnpm test

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A bad manifest, a missing icon, or an entry point that does not bundle
      # would otherwise only surface at publish time.
      - run: pnpm --filter implement-vscode package
      - uses: actions/upload-artifact@v5
        with:
          name: implement-vscode
          path: packages/vscode/implement-vscode.vsix

  registry:
    name: Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # jsrepo resolves `@/lib` imports through `.implement/tsconfig.json`, so
      # the registry needs syncing first or every aliased import is dropped.
      - run: pnpm --filter @apps/docs sync
      # registry.json is committed so `fs://` and the git providers can read the
      # registry straight out of a checkout — rebuild it and fail if it drifted.
      - run: pnpm registry
      - run: git diff --exit-code apps/docs/registry.json

  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the skills index the docs collections, which velite builds
      - run: pnpm --filter @apps/docs generate
      # the agent skills link out to the published `.md` twins rather than
      # carrying a copy of the docs — regenerate the link index and fail if a
      # page was added or renamed without it.
      - run: pnpm skills
      - run: git diff --exit-code .agents/skills

  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the pre-commit hook runs this too, but a hook only exists in a clone
      # that installed, and git will not run one out of a fresh checkout at all
      - run: pnpm check:changesets --all

  jscpd:
    name: Duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm jscpd
